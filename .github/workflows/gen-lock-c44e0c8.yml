name: gen-lock-c44e0c8

on:
  push:
    branches: [audit/a1-concrete-regulated-ym4]
    paths:
      - '.github/workflows/gen-lock-c44e0c8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false

      - name: Verify pinned inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.19.0"
          grep -q 'rev = "c44e0c8ee63ca166450922a373c7409c5d26b00b"' lakefile.toml
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "STALE_MANIFEST_SHA=$(git hash-object lake-manifest.json)"
          cat lake-manifest.json

      - name: Generate manifest with Lake
        shell: bash
        run: |
          set -euo pipefail
          rm -f lake-manifest.json
          lake update mathlib
          test -f lake-manifest.json
          cat lake-manifest.json
          jq -e '
            [.packages[] |
              select(.name == "mathlib") |
              select(.rev == "c44e0c8ee63ca166450922a373c7409c5d26b00b") |
              select(.inputRev == "c44e0c8ee63ca166450922a373c7409c5d26b00b")
            ] | length == 1
          ' lake-manifest.json
          sha256sum lake-manifest.json | tee lake-manifest.sha256

      - name: Upload Lake-generated lock
        uses: actions/upload-artifact@v4
        with:
          name: lake-lock-c44e0c8-${{ github.run_id }}
          path: |
            lake-manifest.json
            lake-manifest.sha256

      - name: Commit exact Lake-generated manifest
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- lakefile.toml lean-toolchain lean MCore || {
            echo "UNEXPECTED_SOURCE_MUTATION"
            exit 1
          }
          git diff --name-only | grep -qx 'lake-manifest.json'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lake-manifest.json
          git commit -m "infra(ym): materialize Lake-generated c44e0c8 lock"
          git push origin HEAD:refs/heads/audit/a1-concrete-regulated-ym4
