name: ATK FINAL_ROOT
on:
  push:
    branches: [atk/auto-compose-terminal-20260930]
    paths:
      - 'lean/**/FinalExternal.lean'
      - '.github/workflows/atk-final-root.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build FINAL_EXTERNAL -> FINAL_ROOT
        run: lake build MCore.YangMills.A1.FinalExternal
