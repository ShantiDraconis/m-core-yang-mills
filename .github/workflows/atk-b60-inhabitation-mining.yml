name: ATK B60 inhabitation mining
on:
  push:
    branches: [atk/auto-compose-terminal-20260930]
    paths:
      - 'lean/MCore/YangMills/A1/B60InhabitationMining.lean'
      - '.github/workflows/atk-b60-inhabitation-mining.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Build and mine target fields
        run: lake build MCore.YangMills.A1.B60InhabitationMining
