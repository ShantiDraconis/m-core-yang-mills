name: First Real Open Math Forcing

on:
  push:
    branches:
      - work/ym-first-real-open-math-20261005
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forcing-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get || true
      - name: Compile exact forcing target
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.OpenMath.ForcingKernel
      - name: Fail closed on placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '\b(sorry|admit|sorryAx|axiom)\b' lean/MCore/OpenMath/ForcingKernel.lean; then
            echo "FORCING_KERNEL_HYGIENE_RED"
            exit 1
          fi
          echo "FORCING_KERNEL_GREEN"
