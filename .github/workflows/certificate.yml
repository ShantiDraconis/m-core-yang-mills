name: certificate
on: [push, pull_request]
jobs:
  final-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: G0 fail-closed hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit)\b' lean MCore --include='*.lean'; then exit 1; fi
          if grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean MCore --include='*.lean'; then exit 1; fi
      - name: G1 preserve frozen K30 boundary
        run: lake build MCore.K29 MCore.K30
      - name: G2 compressed FinalCore build
        run: lake build MCore.FinalCore
      - name: G3 FinalCore axiom closure
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/FinalCoreAxioms.lean <<'EOF'
          import MCore.FinalCore
          #print axioms MCore.final_frontier_blocks_close_k20
          #print axioms MCore.final_spectral_realization_implies_mass_gap
          #print axioms MCore.final_core_closes_conditional_chain
          #print axioms MCore.final_core_target_still_open
          #print axioms MCore.final_core_no_promotion
          EOF
          lake env lean /tmp/FinalCoreAxioms.lean | tee /tmp/final-core.log
          test "$(grep -c 'does not depend on any axioms' /tmp/final-core.log || true)" -eq 5
      - name: G4 dense endpoint and epistemic firewall
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/FinalCoreChecks.lean <<'EOF'
          import MCore.FinalCore
          open MCore
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := final_core_no_promotion
          example : k6_dependency.target.status = .openBridge := final_core_target_still_open
          example {D : K14PhysicalHilbertData}
              {H : K14HamiltonianOperator D}
              {G : K14GapScale D}
              (R : K29SpectralGapRealization D H G) :
              ∃ gap : D.Scale, K14MassGap D H G gap :=
            final_spectral_realization_implies_mass_gap R
          EOF
          lake env lean /tmp/FinalCoreChecks.lean
          grep -q 'construction : K22ConstructionBlock F' lean/MCore/FinalCore.lean
          grep -q 'infrared : K22InfraredBlock F' lean/MCore/FinalCore.lean
          grep -q 'limits : K22LimitBlock F' lean/MCore/FinalCore.lean
          grep -q 'spectral : K29SpectralGapRealization D H G' lean/MCore/FinalCore.lean
          if grep -R -n -E '^theorem .*K20FrontierClosed.*K29SpectralGapRealization' lean/MCore/FinalCore.lean; then exit 1; fi
      - name: G5 umbrella build
        run: lake build MCore
      - name: G6 clean reproduction
        shell: bash
        run: |
          set -euo pipefail
          lake clean
          lake build MCore.K30
          lake build MCore.FinalCore
          lake build MCore
