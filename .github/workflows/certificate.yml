name: certificate
on: [push, pull_request]
jobs:
  k28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: G0 fail-closed hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit)\b' lean MCore --include='*.lean'; then exit 1; fi
          if grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean MCore --include='*.lean'; then exit 1; fi
      - name: G1 preserve K27 limit boundary
        run: lake build MCore.K26 MCore.K27
      - name: G2 explicit K28 build
        run: lake build MCore.K28
      - name: G3 K28 semantic axiom closure
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K28Axioms.lean <<'EOF'
          import MCore.K28
          #print axioms MCore.k28_blocks_recover_frontier
          #print axioms MCore.k28_conditional_mass_gap
          #print axioms MCore.k28_target_still_open
          #print axioms MCore.k28_no_promotion
          EOF
          lake env lean /tmp/K28Axioms.lean | tee /tmp/k28.log
          test "$(grep -c 'does not depend on any axioms' /tmp/k28.log || true)" -eq 4
      - name: G4 assembled-frontier endpoint firewall
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K28Negative.lean <<'EOF'
          import MCore.K28
          open MCore
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := k28_no_promotion
          example : k6_dependency.target.status = .openBridge := k28_target_still_open
          -- Frontier closure only yields a mass-gap witness when the parameterized
          -- K20FrontierToMassGapBridge and physical Hilbert data are supplied.
          EOF
          lake env lean /tmp/K28Negative.lean
          if grep -R -n -E '^theorem .*K28FrontierBlocks.*k6_dependency\.target\.proposition' lean/MCore/K28.lean; then exit 1; fi
      - name: G5 umbrella build
        run: lake build MCore
      - name: G6 clean reproduction
        shell: bash
        run: |
          set -euo pipefail
          lake clean
          lake build MCore.K27
          lake build MCore.K28
          lake build MCore
