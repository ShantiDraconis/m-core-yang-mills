name: certificate
on: [push, pull_request]
jobs:
  k27:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: G0 fail-closed hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit)\b' lean MCore --include='*.lean'; then exit 1; fi
          if grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean MCore --include='*.lean'; then exit 1; fi
      - name: G1 preserve K26 spectral boundary
        run: lake build MCore.K25 MCore.K26
      - name: G2 explicit K27 build
        run: lake build MCore.K27
      - name: G3 K27 semantic axiom closure
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K27Axioms.lean <<'EOF'
          import MCore.K27
          #print axioms MCore.k27_bridge_builds_limit_block
          #print axioms MCore.k27_target_still_open
          #print axioms MCore.k27_no_promotion
          EOF
          lake env lean /tmp/K27Axioms.lean | tee /tmp/k27.log
          test "$(grep -c 'does not depend on any axioms' /tmp/k27.log || true)" -eq 3
      - name: G4 pointwise-gap-to-uniform-limit firewall
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K27Negative.lean <<'EOF'
          import MCore.K27
          open MCore
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := k27_no_promotion
          example : k6_dependency.target.status = .openBridge := k27_target_still_open
          -- Pointwise positivity does not provide a regulator-independent lower bound.
          -- Uniform positivity does not by itself prove preservation under either limit.
          EOF
          lake env lean /tmp/K27Negative.lean
          if grep -R -n -E '^theorem .*K27PointwisePositiveGap.*K27UniformPositiveGap|^theorem .*K27UniformPositiveGap.*K27LimitWitness' lean/MCore/K27.lean; then exit 1; fi
      - name: G5 umbrella build
        run: lake build MCore
      - name: G6 clean reproduction
        shell: bash
        run: |
          set -euo pipefail
          lake clean
          lake build MCore.K26
          lake build MCore.K27
          lake build MCore
