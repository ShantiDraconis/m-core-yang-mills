name: certificate
on: [push, pull_request]
jobs:
  k30:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: G0 fail-closed hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit)\b' lean MCore --include='*.lean'; then exit 1; fi
          if grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean MCore --include='*.lean'; then exit 1; fi
      - name: G1 preserve K29 boundary
        run: lake build MCore.K28 MCore.K29
      - name: G2 explicit K30 build
        run: lake build MCore.K30
      - name: G3 K30 axiom closure
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K30Axioms.lean <<'EOF'
          import MCore.K30
          #print axioms MCore.k30_uniform_clustering_implies_pointwise
          #print axioms MCore.k30_obligations_build_realization
          #print axioms MCore.k30_witness_builds_transfer
          #print axioms MCore.k30_witness_closes_conditional_chain
          #print axioms MCore.k30_target_still_open
          #print axioms MCore.k30_no_promotion
          EOF
          lake env lean /tmp/K30Axioms.lean | tee /tmp/k30.log
          test "$(grep -c 'does not depend on any axioms' /tmp/k30.log || true)" -eq 6
      - name: G4 obligation, clustering, and endpoint firewall
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K30Negative.lean <<'EOF'
          import MCore.K30
          open MCore
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := k30_no_promotion
          example : k6_dependency.target.status = .openBridge := k30_target_still_open
          example {S : K30ClusteringSystemV2}
              (U : K30UniformExponentialClusteringV2 S) :
              K30PointwiseClusteringV2 S :=
            k30_uniform_clustering_implies_pointwise U
          EOF
          lake env lean /tmp/K30Negative.lean
          grep -q 'exponentiallyControlled : Bound → Bound → MassScale → Distance → Prop' lean/MCore/K30.lean
          grep -q 'K30SpectralTransferWitness' lean/MCore/K30.lean
          grep -q 'k30_witness_closes_conditional_chain' lean/MCore/K30.lean
          if grep -R -n -E '^theorem .*K20FrontierClosed.*K29SpectralGapRealization' lean/MCore/K30.lean; then exit 1; fi
          if grep -R -n -E '^theorem .*pointwise.*(implies|to).*uniform|^def .*pointwise.*(implies|to).*uniform' lean/MCore/K30.lean; then exit 1; fi
      - name: G5 umbrella build
        run: lake build MCore
      - name: G6 clean reproduction
        shell: bash
        run: |
          set -euo pipefail
          lake clean
          lake build MCore.K29
          lake build MCore.K30
          lake build MCore
