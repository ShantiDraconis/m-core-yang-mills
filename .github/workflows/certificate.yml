name: certificate
on: [push, pull_request]
jobs:
  k17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: G0 fail-closed hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit)\b' lean MCore --include='*.lean'; then exit 1; fi
          if grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean MCore --include='*.lean'; then exit 1; fi
      - name: G1 preserve K16 and certified frontier
        shell: bash
        run: |
          set -euo pipefail
          lake build MCore.K14 MCore.K15 MCore.K16
          lake build MCore.Frontier.K3Gaps MCore.AttackDAG.K3AlgebraAttacks
      - name: G2 explicit K17 build
        run: lake build MCore.K17
      - name: G3 K17 semantic axiom closure
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K17Axioms.lean <<'EOF'
          import MCore.K17
          #print axioms MCore.k17_clustering_and_cyclicity_imply_semigroup_decay
          #print axioms MCore.k17_target_still_open
          #print axioms MCore.k17_no_promotion
          EOF
          lake env lean /tmp/K17Axioms.lean | tee /tmp/k17.log
          test "$(grep -c 'does not depend on any axioms' /tmp/k17.log || true)" -eq 3
      - name: G4 negative scientific firewall
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K17Negative.lean <<'EOF'
          import MCore.K17
          open MCore
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := k17_no_promotion
          example : k6_dependency.target.status = .openBridge := k17_target_still_open
          example {C : K14UniformExpClusteringData} {O : K17ObservableSectorData}
              {M : K17MatrixElementDecayData} {S : K14SemigroupDecayData}
              (toMatrix : K17ClusteringToMatrixElementsBridge C M)
              (reconstruct : K17ReconstructionCyclicityBridge O M S)
              (clustering : K14UniformExpClustering C)
              (cyclic : O.cyclicGeneratedSector) : K14SemigroupDecay S :=
            k17_clustering_and_cyclicity_imply_semigroup_decay toMatrix reconstruct clustering cyclic
          EOF
          lake env lean /tmp/K17Negative.lean
      - name: G5 umbrella build
        run: lake build MCore
      - name: G6 clean reproduction
        shell: bash
        run: |
          set -euo pipefail
          lake clean
          lake build MCore.K16
          lake build MCore.K17
          lake build MCore
