name: certificate
on: [push, pull_request]
jobs:
  k19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: G0 fail-closed hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit)\b' lean MCore --include='*.lean'; then exit 1; fi
          if grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean MCore --include='*.lean'; then exit 1; fi
      - name: G1 preserve K18 and certified frontier
        shell: bash
        run: |
          set -euo pipefail
          lake build MCore.K16 MCore.K17 MCore.K18
          lake build MCore.Frontier.K3Gaps MCore.AttackDAG.K3AlgebraAttacks
      - name: G2 explicit K19 build
        run: lake build MCore.K19
      - name: G3 K19 semantic axiom closure
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K19Axioms.lean <<'EOF'
          import MCore.K19
          #print axioms MCore.k19_uniform_gap_survives_limits_conditionally
          #print axioms MCore.k19_target_still_open
          #print axioms MCore.k19_no_promotion
          EOF
          lake env lean /tmp/K19Axioms.lean | tee /tmp/k19.log
          test "$(grep -c 'does not depend on any axioms' /tmp/k19.log || true)" -eq 3
      - name: G4 negative limit firewall
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K19Negative.lean <<'EOF'
          import MCore.K19
          open MCore
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := k19_no_promotion
          example : k6_dependency.target.status = .openBridge := k19_target_still_open
          -- Existence of a continuum limit is deliberately insufficient by itself.
          example {A : K19ApproximationFamily} {G : K19UniformGapData A}
              {L : K19ContinuumLimitData A G} (h : L.continuumLimitExists) :
              L.continuumLimitExists := h
          EOF
          lake env lean /tmp/K19Negative.lean
      - name: G5 umbrella build
        run: lake build MCore
      - name: G6 clean reproduction
        shell: bash
        run: |
          set -euo pipefail
          lake clean
          lake build MCore.K18
          lake build MCore.K19
          lake build MCore
