name: certificate

on:
  push:
  pull_request:

jobs:
  k9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1

      - name: G0 fail-closed hygiene across all source roots
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit)\b' lean MCore --include='*.lean'; then
            echo 'Forbidden proof placeholder found'
            exit 1
          fi
          if grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean MCore --include='*.lean'; then
            echo 'Forbidden axiom/constant declaration found'
            exit 1
          fi

      - name: G1 preserve K3-K8
        run: |
          lake build MCore.K3
          lake build MCore.Frontier.K3Gaps
          lake build MCore.AttackDAG.K3AlgebraAttacks
          lake build MCore.K4
          lake build MCore.K5
          lake build MCore.K6
          lake build MCore.K7
          lake build MCore.K8

      - name: G2 explicit K9 builds
        run: |
          lake build MCore.K9.Classical
          lake build MCore.K9

      - name: G3 K9 semantic axiom closure
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/K9Axioms.lean <<'EOF'
          import MCore.K9
          #print axioms MCore.k9_refines_classical_label
          #print axioms MCore.k9_quantum_still_labelled_open
          #print axioms MCore.k9_target_still_open
          #print axioms MCore.k9_no_promotion
          EOF
          lake env lean /tmp/K9Axioms.lean | tee /tmp/k9_axioms.log
          count=$(grep -c 'does not depend on any axioms' /tmp/k9_axioms.log || true)
          test "$count" -eq 4

      - name: G4 negative K9 firewall
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/K9Negative.lean <<'EOF'
          import MCore.K9
          open MCore
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := k9_no_promotion
          example : k6_dependency.target.status = .openBridge := k9_target_still_open
          EOF
          lake env lean /tmp/K9Negative.lean

      - name: G5 umbrella build
        run: lake build MCore

      - name: G6 clean reproduction
        shell: bash
        run: |
          set -euo pipefail
          lake clean
          lake build MCore.K8
          lake build MCore.K9.Classical
          lake build MCore.K9
          lake build MCore
