name: certificate
on: [push, pull_request]
jobs:
  k20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: G0 fail-closed hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit)\b' lean MCore --include='*.lean'; then exit 1; fi
          if grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean MCore --include='*.lean'; then exit 1; fi
      - name: G1 preserve K19 and full certified interface chain
        shell: bash
        run: |
          set -euo pipefail
          lake build MCore.K14 MCore.K15 MCore.K16 MCore.K17 MCore.K18 MCore.K19
          lake build MCore.Frontier.K3Gaps MCore.AttackDAG.K3AlgebraAttacks
      - name: G2 explicit K20 build
        run: lake build MCore.K20
      - name: G3 K20 semantic axiom closure
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K20Axioms.lean <<'EOF'
          import MCore.K20
          #print axioms MCore.k20_closed_frontier_implies_mass_gap
          #print axioms MCore.k20_target_still_open
          #print axioms MCore.k20_no_promotion
          #print axioms MCore.k20_interfaces_certified
          #print axioms MCore.k20_frontier_not_marked_closed
          EOF
          lake env lean /tmp/K20Axioms.lean | tee /tmp/k20.log
          test "$(grep -c 'does not depend on any axioms' /tmp/k20.log || true)" -eq 5
      - name: G4 final epistemic firewall
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K20Negative.lean <<'EOF'
          import MCore.K20
          open MCore
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := k20_no_promotion
          example : k6_dependency.target.status = .openBridge := k20_target_still_open
          example : k20_interface_audit_state.interfacesCertified := k20_interfaces_certified
          example : ¬ k20_interface_audit_state.scientificFrontierClosed := k20_frontier_not_marked_closed
          EOF
          lake env lean /tmp/K20Negative.lean
      - name: G5 umbrella build
        run: lake build MCore
      - name: G6 clean reproduction
        shell: bash
        run: |
          set -euo pipefail
          lake clean
          lake build MCore.K19
          lake build MCore.K20
          lake build MCore
