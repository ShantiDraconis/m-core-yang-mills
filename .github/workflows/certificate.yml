name: certificate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  final-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          build: false
          test: false
          lint: false
      - name: G0 pinned manifest check
        shell: bash
        run: |
          set -euo pipefail
          set -x
          ls -la
          test -f lake-manifest.json || { echo "FAIL: lake-manifest.json missing"; ls -la .lake/ 2>&1 || true; exit 1; }
          echo "== lake-manifest.json found =="
          cat lake-manifest.json
          echo "== pinned revs in manifest =="
          grep -o '"rev": "[^"]*"' lake-manifest.json || true
          echo "== declared mathlib pin in lakefile.toml =="
          grep -A4 '^\[\[require\]\]' lakefile.toml
          grep -q 'name = "mathlib"' lakefile.toml || { echo "FAIL: mathlib requirement missing"; exit 1; }
          grep -q 'rev = "c44e0c8ee63ca166450922a373c7409c5d26b00b"' lakefile.toml || {
            echo "FAIL: expected Mathlib input rev not declared"
            exit 1
          }
          python3 -c 'import json; m=json.load(open("lake-manifest.json")); pkgs=m.get("packages", []); assert pkgs, "FAIL: committed lake-manifest.json is unresolved (packages is empty)"; mathlib=[p for p in pkgs if p.get("name")=="mathlib"]; assert mathlib, "FAIL: resolved manifest has no mathlib package entry"; rev=mathlib[0].get("rev"); expected="c44e0c8ee63ca166450922a373c7409c5d26b00b"; assert rev == expected, f"FAIL: resolved mathlib rev {rev!r} != {expected}"; print("PASS: manifest resolves mathlib at", rev)'
          lake env lean --version
      - name: G1 compile compatible spectral infrastructure
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/MathlibSpectralProbe.lean <<'EOF'
          import Mathlib.Analysis.InnerProductSpace.Spectrum
          import Mathlib.Analysis.CStarAlgebra.Spectrum
          #check LinearMap.IsSymmetric.conj_eigenvalue_eq_self
          #check LinearMap.IsSymmetric.orthogonalFamily_eigenspaces
          EOF
          lake env lean /tmp/MathlibSpectralProbe.lean
      - name: G2 fail-closed hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit)\b' lean MCore --include='*.lean'; then exit 1; fi
          if grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean MCore --include='*.lean'; then exit 1; fi
      - name: G3 preserve frozen K30 boundary
        run: lake build MCore.K29 MCore.K30
      - name: G4 compressed spectral core
        run: lake build MCore.FinalCore MCore.SpectralCore
      - name: G5 axiom closure
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/CoreAxioms.lean <<'EOF'
          import MCore.SpectralCore
          #print axioms MCore.final_frontier_blocks_close_k20
          #print axioms MCore.final_spectral_realization_implies_mass_gap
          #print axioms MCore.final_core_closes_conditional_chain
          #print axioms MCore.final_core_target_still_open
          #print axioms MCore.final_core_no_promotion
          #print axioms MCore.decay_implies_exclusion
          EOF
          lake env lean /tmp/CoreAxioms.lean | tee /tmp/core-axioms.log
          test "$(grep -c 'does not depend on any axioms' /tmp/core-axioms.log || true)" -eq 6
      - name: G6 endpoint and analytic-frontier firewall
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/CoreChecks.lean <<'EOF'
          import MCore.SpectralCore
          open MCore
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := final_core_no_promotion
          example : k6_dependency.target.status = .openBridge := final_core_target_still_open
          example {M : SpectralDecayModel}
              (T : DecayToSpectralExclusion M)
              (m : M.Rate) (psi : M.State)
              (hm : M.positiveRate m)
              (hp : M.physical psi)
              (ho : M.orthogonalToVacuum psi)
              (hd : M.matrixElementDecay m psi) :
              M.excludesBelow m psi := decay_implies_exclusion T m psi hm hp ho hd
          EOF
          lake env lean /tmp/CoreChecks.lean
          grep -q 'def SpectralAnalyticOpenBridge' lean/MCore/SpectralCore.lean
          if grep -R -n -E 'def SpectralAnalyticOpenBridge.*:= *True' lean/MCore/SpectralCore.lean; then exit 1; fi
      - name: G7 targeted reproducibility
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          # Do not run the umbrella target or lake clean in normal certification.
          # Every scientific endpoint is compiled explicitly; Lake reuses the pinned cache.
          lake build MCore.K29 MCore.K30 MCore.FinalCore MCore.SpectralCore MCore.PhysicalGapScaling
          lake build MCore.YangMills.A1.RegulatedConstruction MCore.YangMills.A1.UniformityFirewalls MCore.YangMills.A1.UniformityTriviality MCore.YangMills.A1.Hardening MCore.YangMills.A1.PhantomBridgeTriviality MCore.YangMills.A1.FrontierDecompositionV2 MCore.YangMills.A1.B60ConcretePhysicalAdapter MCore.YangMills.A1.PositiveControl MCore.YangMills.A1.FrontierDecomposition MCore.YangMills.A1.HardeningV2 MCore.YangMills.A1.MaterialHardeningV3 MCore.YangMills.A1.PhysicalExcitationReconstructionV4 MCore.YangMills.A1.CanonicalSameModelBundleV5 MCore.YangMills.A1.DerivedAnalyticLawsV6 MCore.YangMills.A1.DecayCalculusV7 MCore.YangMills.A1.Canonical4DGeometryV8 MCore.YangMills.A1.ConcreteSpectralK30V9 MCore.YangMills.A1.SpectralMeasureHilbertBindingV10 MCore.YangMills.A1.CanonicalIdentitySpectralBindingV11 MCore.YangMills.A1.GapConcreteV13 MCore.YangMills.A1.B60TrivialityAudit MCore.YangMills.A1.B60CanonicalPhysicalBinding MCore.YangMills.A1.FinalExternal MCore.YangMills.A1.ExactFinalProducer MCore.YangMills.A1.B60FieldBundle MCore.YangMillsTerminalLaw
          echo "TARGETED_REPRODUCTION=PASS"

      - name: G6b axiom-gate negative controls
        shell: bash
        env:
          G6B_ALLOWED_AXIOMS: ''
        run: |
          set -euo pipefail
          test_gate() {
            local input="$1"
            local expected="$2"
            printf '%s\n' "$input" >/tmp/axiom-test.log
            set +e
            EXPECTED_THEOREM_COUNT=1 bash scripts/axiom-gate-G6b.sh /tmp/axiom-test.log /tmp/footprint.txt
            local code=$?
            set -e
            if [ "$expected" = "RED" ] && [ "$code" -eq 0 ]; then
              echo "NEGATIVE_CONTROL_FAIL expected RED: $input"
              exit 1
            fi
            if [ "$expected" = "GREEN" ] && [ "$code" -ne 0 ]; then
              echo "NEGATIVE_CONTROL_FAIL expected GREEN: $input"
              exit 1
            fi
          }
          test_gate "'foo' depends on axioms: [Classical.choice]" RED
          test_gate "'foo' depends on axioms: [propext, Quot.sound]" RED
          test_gate "'foo' depends on axioms: [propext, Classical.choice, Quot.sound]" RED
          test_gate "'foo' does not depend on any axioms" GREEN
          test_gate "'foo' depends on axioms: [sorryAx]" RED
          echo "G6B_NEGATIVE_CONTROLS=PASS"

      - name: G6b physical scaling adversarial audit
        shell: bash
        env:
          G6B_ALLOWED_AXIOMS: 'propext,Classical.choice,Quot.sound'
          EXPECTED_THEOREM_COUNT: '3'
        run: |
          set -euo pipefail
          lake build MCore.PhysicalGapScaling
          cat >/tmp/PhysicalGapChecks.lean <<'EOF'
          import MCore.PhysicalGapScaling
          #print axioms MCore.physical_mass_bound_iterates
          #print axioms MCore.finite_volume_gap_not_uniform
          #print axioms MCore.positive_cutoff_gap_not_physical_uniform
          EOF
          lake env lean /tmp/PhysicalGapChecks.lean 2>&1 | tee /tmp/physical-gap-axioms.log
          bash scripts/axiom-gate-G6b.sh /tmp/physical-gap-axioms.log /tmp/g6b-footprint.txt

      - name: G6b positive-control axiom audit
        shell: bash
        env:
          G6B_ALLOWED_AXIOMS: 'propext,Classical.choice,Quot.sound'
          EXPECTED_THEOREM_COUNT: '1'
        run: |
          set -euo pipefail
          lake build MCore.YangMills.A1.PositiveControl
          cat >/tmp/PositiveControlChecks.lean <<'EOF'
          import MCore.YangMills.A1.PositiveControl
          #print axioms MCore.YangMills.A1.toy_a1_scientific_witness
          EOF
          lake env lean /tmp/PositiveControlChecks.lean 2>&1 | tee /tmp/positive-control-axioms.log
          bash scripts/axiom-gate-G6b.sh /tmp/positive-control-axioms.log /tmp/g6b-positive-control-footprint.txt

      - name: G6b B5 triviality RED audit
        shell: bash
        env:
          G6B_ALLOWED_AXIOMS: 'propext,Classical.choice,Quot.sound'
          EXPECTED_THEOREM_COUNT: '3'
        run: |
          set -euo pipefail
          lake build MCore.YangMills.A1.UniformityTriviality
          cat >/tmp/B5TrivialityChecks.lean <<'EOF'
          import MCore.YangMills.A1.UniformityTriviality
          #print axioms MCore.YangMills.A1.uniform_regulator_control_inhabited_for_every_construction
          #print axioms MCore.YangMills.A1.a1_uniformity_bridge_inhabited_for_every_construction
          #print axioms MCore.YangMills.A1.pointwise_to_uniform_bridge_vacuously_holds
          EOF
          lake env lean /tmp/B5TrivialityChecks.lean 2>&1 | tee /tmp/b5-triviality-axioms.log
          bash scripts/axiom-gate-G6b.sh /tmp/b5-triviality-axioms.log /tmp/g6b-b5-triviality-footprint.txt
          echo "B5_CURRENT_DEFINITION_TRIVIALLY_INHABITED=PASS"
          echo "B5_BLOCKING_OPEN_CLASSIFICATION=INVALIDATED"

      - name: G6b B3-B5 phantom-bridge RED audit
        shell: bash
        env:
          G6B_ALLOWED_AXIOMS: 'propext,Classical.choice,Quot.sound'
          EXPECTED_THEOREM_COUNT: '3'
        run: |
          set -euo pipefail
          lake build MCore.YangMills.A1.PhantomBridgeTriviality
          cat >/tmp/PhantomBridgeChecks.lean <<'EOF'
          import MCore.YangMills.A1.PhantomBridgeTriviality
          #print axioms MCore.YangMills.A1.reflection_positivity_data_inhabited_for_every_construction
          #print axioms MCore.YangMills.A1.positive_transfer_data_inhabited_for_every_construction
          #print axioms MCore.YangMills.A1.a1_scientific_open_bridge_iff_B1_B2
          EOF
          lake env lean /tmp/PhantomBridgeChecks.lean 2>&1 | tee /tmp/phantom-bridge-axioms.log
          bash scripts/axiom-gate-G6b.sh /tmp/phantom-bridge-axioms.log /tmp/g6b-phantom-bridge-footprint.txt
          echo "B3_B4_B5_CURRENT_INTERFACES_TRIVIALLY_DISCHARGEABLE=PASS"
          echo "A1_ENDPOINT_REDUCES_TO_B1_B2=PASS"

      - name: G6b A1 frontier-v2 audit
        shell: bash
        env:
          G6B_ALLOWED_AXIOMS: ''
          EXPECTED_THEOREM_COUNT: '4'
        run: |
          set -euo pipefail
          lake build MCore.YangMills.A1.FrontierDecompositionV2
          cat >/tmp/A1FrontierV2Checks.lean <<'EOF'
          import MCore.YangMills.A1.FrontierDecompositionV2
          #print axioms MCore.YangMills.A1.a1_v2_has_six_nodes
          #print axioms MCore.YangMills.A1.a1_v2_invalidates_exactly_three_legacy_interfaces
          #print axioms MCore.YangMills.A1.a1_v2_has_exactly_one_blocking_node
          #print axioms MCore.YangMills.A1.a1_v2_blocking_node_is_k20_k30
          EOF
          lake env lean /tmp/A1FrontierV2Checks.lean 2>&1 | tee /tmp/a1-frontier-v2-axioms.log
          bash scripts/axiom-gate-G6b.sh /tmp/a1-frontier-v2-axioms.log /tmp/g6b-a1-frontier-v2-footprint.txt
          echo "A1_FRONTIER_V2=PASS"
          echo "LEGACY_B3_B4_B5=INVALIDATED"
          echo "CURRENT_BLOCKING_NODE=B6_K20_K30_CONCRETE_PHYSICAL_REALIZATION"

      - name: G6b B6.0 concrete-adapter audit
        shell: bash
        env:
          G6B_ALLOWED_AXIOMS: 'propext,Classical.choice,Quot.sound'
          EXPECTED_THEOREM_COUNT: '2'
        run: |
          set -euo pipefail
          lake build MCore.YangMills.A1.B60ConcretePhysicalAdapter
          cat >/tmp/B60Checks.lean <<'EOF'
          import MCore.YangMills.A1.B60ConcretePhysicalAdapter
          #print axioms MCore.YangMills.A1.b60_adapter_closes_conditional_chain
          #print axioms MCore.YangMills.A1.b60_legacy_endpoint_contains_only_B1_B2
          EOF
          lake env lean /tmp/B60Checks.lean 2>&1 | tee /tmp/b60-axioms.log
          bash scripts/axiom-gate-G6b.sh /tmp/b60-axioms.log /tmp/g6b-b60-footprint.txt
          echo "B60_TYPED_BOUNDARY=PASS"
          echo "B60_WITNESS=OPEN_BRIDGE"
          echo "NO_LEGACY_A1_TO_B60_PROMOTION=PASS"

      - name: G6c gauge-action rejection probe
        shell: bash
        env:
          G6B_ALLOWED_AXIOMS: ''
          EXPECTED_THEOREM_COUNT: '6'
        run: |
          set -euo pipefail
          lake build MCore.YangMills.A1.P02RejectionGaugeInvariantProbe
          cat >/tmp/YMGaugeProbeChecks.lean <<'EOF'
          import MCore.YangMills.A1.P02RejectionGaugeInvariantProbe
          #print axioms MCore.YangMills.A1.GaugeProbe.gaugeGroupLaw
          #print axioms MCore.YangMills.A1.GaugeProbe.gaugeInverseRestores
          #print axioms MCore.YangMills.A1.GaugeProbe.gap_eq_of_gaugeEquivalent
          #print axioms MCore.YangMills.A1.GaugeProbe.producer_implies_massGap
          #print axioms MCore.YangMills.A1.gauge_invariance_does_not_force_mass_gap
          #print axioms MCore.YangMills.A1.toyFreePhoton_has_no_uniformPositiveGapProducer
          EOF
          lake env lean /tmp/YMGaugeProbeChecks.lean 2>&1 | tee /tmp/ym-gauge-probe-axioms.log
          bash scripts/axiom-gate-G6b.sh /tmp/ym-gauge-probe-axioms.log /tmp/g6c-ym-gauge-probe-footprint.txt
          echo "YM_GAUGE_GROUP_ACTION=PASS"
          echo "YM_ZERO_GAP_NEGATIVE_CONTROL=PASS"
          echo "YM_MASS_GAP_NON_PROMOTION=PASS"
          echo "YM_Q10_UNIFORM_PHYSICAL_GAP_PRODUCER=OPEN_MATH"

      - name: Upload G6b axiom evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g6b-axiom-evidence-${{ github.run_id }}
          path: |
            /tmp/physical-gap-axioms.log
            /tmp/g6b-footprint.txt
            /tmp/positive-control-axioms.log
            /tmp/g6b-positive-control-footprint.txt
            /tmp/b5-triviality-axioms.log
            /tmp/g6b-b5-triviality-footprint.txt
            /tmp/phantom-bridge-axioms.log
            /tmp/g6b-phantom-bridge-footprint.txt
            /tmp/a1-frontier-v2-axioms.log
            /tmp/g6b-a1-frontier-v2-footprint.txt
            /tmp/b60-axioms.log
            /tmp/g6b-b60-footprint.txt
          if-no-files-found: warn

