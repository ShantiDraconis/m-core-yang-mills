name: certificate
on: [push, pull_request]
jobs:
  k6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Restore Mathlib build cache
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages/mathlib/.lake/build
            .lake/packages/batteries/.lake/build
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'lakefile.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-
      - name: Resolve pinned dependencies and hydrate Mathlib cache
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: G0 fail-closed hygiene across all source roots
        run: |
          set -euo pipefail
          scan='lean MCore'
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' $scan; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' $scan; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - name: Compile legacy certificate firewall
        run: 'lake env lean MCore/YM/K0.lean'
      - {name: Preserve K3, run: 'lake build MCore.K3 && lake build MCore.Frontier.K3Gaps && lake build MCore.AttackDAG.K3AlgebraAttacks'}
      - {name: Preserve K4-K5, run: 'lake build MCore.K4 && lake build MCore.K5'}
      - {name: Build K6 dependency kernel, run: 'lake build MCore.K6'}
      - name: K6 semantic axiom closure
        run: |
          printf 'import MCore.K6\n#print axioms MCore.k6_source_open\n#print axioms MCore.k6_target_open\n#print axioms MCore.k6_target_not_certified\n' > K6AxiomAudit.lean
          lake env lean K6AxiomAudit.lean 2>&1 | tee K6AxiomAudit.log
          grep -F "'MCore.k6_source_open' does not depend on any axioms" K6AxiomAudit.log
          grep -F "'MCore.k6_target_open' does not depend on any axioms" K6AxiomAudit.log
          grep -F "'MCore.k6_target_not_certified' does not depend on any axioms" K6AxiomAudit.log
      - name: Legacy firewall semantic axiom closure
        run: |
          printf '#print axioms MCore.YM.openBridge_not_certified\n' >> MCore/YM/K0.lean
          lake env lean MCore/YM/K0.lean 2>&1 | tee LegacyAxiomAudit.log
          grep -F "'MCore.YM.openBridge_not_certified' does not depend on any axioms" LegacyAxiomAudit.log
      - name: Negative K6 firewall regression
        run: |
          printf 'import MCore.K6\nopen MCore\nexample : ¬ Nonempty (ProofCertificate k6_dependency.target) := k6_target_not_certified\n' > NegativeK6.lean
          lake env lean NegativeK6.lean
      - name: Clean reproduction
        run: 'lake clean && lake env lean MCore/YM/K0.lean && lake build MCore.K6 && lake build MCore'
