name: certificate
on: [push, pull_request]
jobs:
  k23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: G0 fail-closed hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit)\b' lean MCore --include='*.lean'; then exit 1; fi
          if grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean MCore --include='*.lean'; then exit 1; fi
      - name: G1 preserve K22 scientific partition
        shell: bash
        run: |
          set -euo pipefail
          lake build MCore.K20 MCore.K21 MCore.K22
          lake build MCore.Frontier.K3Gaps MCore.AttackDAG.K3AlgebraAttacks
      - name: G2 explicit K23 build
        run: lake build MCore.K23
      - name: G3 K23 semantic axiom closure
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K23Axioms.lean <<'EOF'
          import MCore.K23
          #print axioms MCore.k23_inputs_build_construction_block
          #print axioms MCore.k23_target_still_open
          #print axioms MCore.k23_no_promotion
          EOF
          lake env lean /tmp/K23Axioms.lean | tee /tmp/k23.log
          test "$(grep -c 'does not depend on any axioms' /tmp/k23.log || true)" -eq 3
      - name: G4 construction firewall
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K23Negative.lean <<'EOF'
          import MCore.K23
          open MCore
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := k23_no_promotion
          example : k6_dependency.target.status = .openBridge := k23_target_still_open
          example {F : K20ScientificFrontier} (C : K23ConstructiveYM4Data F)
              (h : K23ConstructionInputsHold C) : K22ConstructionBlock F :=
            k23_inputs_build_construction_block C h
          -- No K23ConstructionInputsHold witness for actual YM4 is constructed here.
          EOF
          lake env lean /tmp/K23Negative.lean
      - name: G5 umbrella build
        run: lake build MCore
      - name: G6 clean reproduction
        shell: bash
        run: |
          set -euo pipefail
          lake clean
          lake build MCore.K22
          lake build MCore.K23
          lake build MCore
