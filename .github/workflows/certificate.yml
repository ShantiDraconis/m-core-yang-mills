name: certificate
on: [push, pull_request]
jobs:
  k21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: G0 fail-closed hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit)\b' lean MCore --include='*.lean'; then exit 1; fi
          if grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean MCore --include='*.lean'; then exit 1; fi
      - name: G1 preserve K20 epistemic boundary
        shell: bash
        run: |
          set -euo pipefail
          lake build MCore.K18 MCore.K19 MCore.K20
          lake build MCore.Frontier.K3Gaps MCore.AttackDAG.K3AlgebraAttacks
      - name: G2 explicit K21 build
        run: lake build MCore.K21
      - name: G3 K21 semantic axiom closure
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K21Axioms.lean <<'EOF'
          import MCore.K21
          #print axioms MCore.k21_witnesses_close_frontier
          #print axioms MCore.k21_witnesses_imply_mass_gap_conditionally
          #print axioms MCore.k21_target_still_open
          #print axioms MCore.k21_no_promotion
          EOF
          lake env lean /tmp/K21Axioms.lean | tee /tmp/k21.log
          test "$(grep -c 'does not depend on any axioms' /tmp/k21.log || true)" -eq 4
      - name: G4 witness and no-promotion firewall
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K21Negative.lean <<'EOF'
          import MCore.K21
          open MCore
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := k21_no_promotion
          example : k6_dependency.target.status = .openBridge := k21_target_still_open
          example {F : K20ScientificFrontier} (W : K21FrontierWitnesses F) :
              K20FrontierClosed F := k21_witnesses_close_frontier W
          -- No inhabitant of K21FrontierWitnesses for actual YM4 is constructed here.
          EOF
          lake env lean /tmp/K21Negative.lean
      - name: G5 umbrella build
        run: lake build MCore
      - name: G6 clean reproduction
        shell: bash
        run: |
          set -euo pipefail
          lake clean
          lake build MCore.K20
          lake build MCore.K21
          lake build MCore
