name: certificate
on: [push, pull_request]
jobs:
  k26:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: G0 fail-closed hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit)\b' lean MCore --include='*.lean'; then exit 1; fi
          if grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean MCore --include='*.lean'; then exit 1; fi
      - name: G1 preserve K25 uniform-clustering boundary
        run: lake build MCore.K24 MCore.K25
      - name: G2 explicit K26 build
        run: lake build MCore.K26
      - name: G3 K26 semantic axiom closure
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K26Axioms.lean <<'EOF'
          import MCore.K26
          #print axioms MCore.k26_bridge_supplies_infrared_auxiliaries
          #print axioms MCore.k26_target_still_open
          #print axioms MCore.k26_no_promotion
          EOF
          lake env lean /tmp/K26Axioms.lean | tee /tmp/k26.log
          test "$(grep -c 'does not depend on any axioms' /tmp/k26.log || true)" -eq 3
      - name: G4 observable-sector spectral firewall
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K26Negative.lean <<'EOF'
          import MCore.K26
          open MCore
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := k26_no_promotion
          example : k6_dependency.target.status = .openBridge := k26_target_still_open
          -- Observable matrix-element decay is not definitionally a physical spectral gap.
          -- The decay-to-spectral transfer remains explicit K26DecayToSpectralBridge data.
          EOF
          lake env lean /tmp/K26Negative.lean
          if grep -R -n -E '^theorem .*K26ObservableDecayWitness.*K26DecayToSpectralBridge|^theorem .*K26ObservableDecayWitness.*spectralSupportAboveGap' lean/MCore/K26.lean; then exit 1; fi
      - name: G5 umbrella build
        run: lake build MCore
      - name: G6 clean reproduction
        shell: bash
        run: |
          set -euo pipefail
          lake clean
          lake build MCore.K25
          lake build MCore.K26
          lake build MCore
