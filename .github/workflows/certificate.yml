name: certificate
on: [push, pull_request]
jobs:
  k24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: G0 fail-closed hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit)\b' lean MCore --include='*.lean'; then exit 1; fi
          if grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean MCore --include='*.lean'; then exit 1; fi
      - name: G1 preserve K23 construction boundary
        run: lake build MCore.K21 MCore.K22 MCore.K23
      - name: G2 explicit K24 build
        run: lake build MCore.K24
      - name: G3 K24 semantic axiom closure
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K24Axioms.lean <<'EOF'
          import MCore.K24
          #print axioms MCore.k24_measure_controls_feed_k23
          #print axioms MCore.k24_target_still_open
          #print axioms MCore.k24_no_promotion
          EOF
          lake env lean /tmp/K24Axioms.lean | tee /tmp/k24.log
          test "$(grep -c 'does not depend on any axioms' /tmp/k24.log || true)" -eq 3
      - name: G4 regulator-uniformity firewall
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K24Negative.lean <<'EOF'
          import MCore.K24
          open MCore
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := k24_no_promotion
          example : k6_dependency.target.status = .openBridge := k24_target_still_open
          -- A regulated model, cutoff tightness, or volume tightness alone does not construct the target.
          EOF
          lake env lean /tmp/K24Negative.lean
      - name: G5 umbrella build
        run: lake build MCore
      - name: G6 clean reproduction
        shell: bash
        run: |
          set -euo pipefail
          lake clean
          lake build MCore.K23
          lake build MCore.K24
          lake build MCore
