name: ATK YM producer kernel

on:
  push:
    branches:
      - atk/next-ym-physical-inhabitant-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Build exact producer frontier
        run: lake build MCore.YangMills.A1.B60ConcretePhysicalAdapter MCore.SpectralConcreteAdapter MCore.K30 MCore.YangMills.A1.HardeningV2 MCore.YangMills.A1.RegulatedConstruction
      - name: Reject proof escapes in producer sources
        run: |
          set -euo pipefail
          PAT='(:=[[:space:]]*sorry([^[:alnum:]_]|$)|by[[:space:]]+sorry([^[:alnum:]_]|$)|^[[:space:]]*sorry([^[:alnum:]_]|$)|(^|[^[:alnum:]_])admit([^[:alnum:]_]|$)|^[[:space:]]*(axiom|constant|constants)[[:space:]])'
          if grep -nE "$PAT" "lean/MCore/YangMills/A1/B60ConcretePhysicalAdapter.lean" "lean/MCore/SpectralConcreteAdapter.lean" "lean/MCore/K30.lean" "lean/MCore/YangMills/A1/HardeningV2.lean" "lean/MCore/YangMills/A1/RegulatedConstruction.lean"; then
            echo "producer proof escape found"
            exit 1
          fi
