name: ym-unified-final-v13
on:
  push:
    branches: [atk/ym-rejection-gauge-v13-20261006]
  workflow_dispatch:

concurrency:
  group: ym-unified-final-v13-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unified-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          build: false
          test: false
          lint: false

      - name: G1 RPA dual endpoint + lattice
        run: |
          lake build             MCore.YangMills.A1.RPADualConfirmationV13             MCore.YangMills.A1.RPADualEndpointLatticeV13

      - name: G1b Terminal signature cycle
        run: lake build MCore.YangMills.A1.TerminalSignatureCycleV13 MCore.YangMills.A1.TerminalFrontierStateV13

      - name: G1c Gauge rejection probe
        run: lake build MCore.YangMills.A1.P02RejectionGaugeInvariantProbe

      - name: G2 Material payload
        run: lake build MCore.YangMills.A1.YMMaterialPayloadV13

      - name: G3 Terminal continuum compression
        run: lake build MCore.YangMills.A1.TerminalContinuumGapV13

      - name: G4 Regulated continuum realization
        run: lake build MCore.YangMills.A1.RegulatedContinuumRealizationV13

      - name: G5 Open-math terminal frontier
        run: |
          lake build MCore.YangMills.A1.FiniteRegulatedSpectralV13
          lake env lean open_math/P02_YM_V13_ContinuumGap.lean

      - name: G6 Final closure certificate
        run: lake build MCore.YangMills.A1.FinalClosureCertificateV13

      - name: Placeholder audit
        shell: bash
        run: |
          set -euo pipefail
          files=(
            lean/MCore/YangMills/A1/RPADualConfirmationV13.lean
            lean/MCore/YangMills/A1/RPADualEndpointLatticeV13.lean
            lean/MCore/YangMills/A1/YMMaterialPayloadV13.lean
            lean/MCore/YangMills/A1/FinalClosureCertificateV13.lean
            lean/MCore/YangMills/A1/FinalExternal.lean
            lean/MCore/YangMills/A1/ExactFinalProducer.lean
            open_math/P02_YM_V13_ContinuumGap.lean
          )
          python - "${files[@]}" <<'PY'
          import re
          import sys

          def strip_lean_comments(src: str) -> str:
              out = []
              i = 0
              depth = 0
              in_string = False
              escaped = False
              while i < len(src):
                  if depth:
                      if src.startswith('/-', i):
                          depth += 1
                          i += 2
                      elif src.startswith('-/', i):
                          depth -= 1
                          i += 2
                      else:
                          if src[i] == '\n':
                              out.append('\n')
                          i += 1
                      continue
                  if in_string:
                      ch = src[i]
                      out.append(' ')
                      if escaped:
                          escaped = False
                      elif ch == '\\\\':
                          escaped = True
                      elif ch == '"':
                          in_string = False
                      i += 1
                      continue
                  if src.startswith('--', i):
                      while i < len(src) and src[i] != '\n':
                          i += 1
                      continue
                  if src.startswith('/-', i):
                      depth = 1
                      i += 2
                      continue
                  if src[i] == '"':
                      in_string = True
                      out.append(' ')
                      i += 1
                      continue
                  out.append(src[i])
                  i += 1
              return ''.join(out)

          bad = re.compile(r'(?<![A-Za-z0-9_])(sorry|admit)(?![A-Za-z0-9_])')
          failed = False
          for path in sys.argv[1:]:
              text = strip_lean_comments(open(path, encoding='utf-8').read())
              for n, line in enumerate(text.splitlines(), 1):
                  if bad.search(line):
                      print(f"{path}:{n}:{line.strip()}")
                      failed = True
          raise SystemExit(1 if failed else 0)
          PY

      - name: Unified axiom audit
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/YMUnifiedFinalChecks.lean <<'EOF'
          import MCore.YangMills.A1.RPADualConfirmationV13
          import MCore.YangMills.A1.RPADualEndpointLatticeV13
          import MCore.YangMills.A1.YMMaterialPayloadV13
          import MCore.YangMills.A1.TerminalSignatureCycleV13
          import MCore.YangMills.A1.P02RejectionGaugeInvariantProbe
          import MCore.YangMills.A1.TerminalContinuumGapV13
          import MCore.YangMills.A1.RegulatedContinuumRealizationV13
          import MCore.YangMills.A1.FinalClosureCertificateV13

          #print axioms MCore.YangMills.A1.Final.endpoint_to_gap
          #print axioms MCore.YangMills.A1.Final.terminal_cycle
          #print axioms MCore.YangMills.A1.Final.terminal_signature_iff_FINAL_ROOT
          #print axioms MCore.YangMills.A1.GaugeProbe.gaugeGroupLaw
          #print axioms MCore.YangMills.A1.GaugeProbe.gap_eq_of_gaugeEquivalent
          #print axioms MCore.YangMills.A1.gauge_invariance_does_not_force_mass_gap
          #print axioms MCore.YangMills.A1.Final.openEndpoint_ne_closedEndpoint
          #print axioms MCore.YangMills.A1.Final.dualEndpointState_iff_finalRoot
          #print axioms MCore.YangMills.A1.Final.CanonicalEndpointState.CUBE_UP_TO_3_CLOSED
          #print axioms MCore.YangMills.A1.Final.fullEndpointPayload_iff_finalRoot

          #print axioms MCore.YangMills.A1.Final.ymPayload_construction_and_reconstruction
          #print axioms MCore.YangMills.A1.Final.ymPayload_clustering
          #print axioms MCore.YangMills.A1.Final.ymPayload_to_finalExternal
          #print axioms MCore.YangMills.A1.Final.ymPayload_to_FINAL_ROOT
          #print axioms MCore.YangMills.A1.Final.ymPayload_to_rpa_confirmation

          #print axioms MCore.YangMills.A1.ContinuumSpectralLimitV13.finite_lowSpectrumExclusion
          #print axioms MCore.YangMills.A1.ContinuumSpectralLimitV13.eventual_lowSpectrumExclusion
          #print axioms MCore.YangMills.A1.ContinuumSpectralLimitV13.continuum_gap_from_uniformFiniteEdge

          #print axioms MCore.YangMills.A1.RegulatedContinuumRealizationV13.derived_uniformFiniteEdge
          #print axioms MCore.YangMills.A1.RegulatedContinuumRealizationV13.continuum_gap

          #print axioms MCore.YangMills.A1.Final.FORMAL_CHAIN_CLOSED
          #print axioms MCore.YangMills.A1.Final.SCIENTIFIC_TARGET_REMAINS_OPEN_BRIDGE
          #print axioms MCore.YangMills.A1.Final.NO_UNCONDITIONAL_PROMOTION
          EOF
          lake env lean /tmp/YMUnifiedFinalChecks.lean
